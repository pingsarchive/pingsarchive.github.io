name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  workflow_dispatch:


permissions:
  contents: write
  pages: write
  id-token: write


jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Assign permanent finding numbers
        run: node src/scripts/assign-archive-numbers.mjs

      - name: Assign permanent note numbers
        run: node src/scripts/assign-note-numbers.mjs


      - name: Save permanent content numbers
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/archive
            if [ -d src/content/notes ]; then
              git add src/content/notes
            fi
            git commit -m "assign permanent content numbers"
            git push
          fi


      - name: Install, build, and upload site
        uses: withastro/action@v6


  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
