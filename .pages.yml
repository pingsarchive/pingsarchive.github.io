settings:
  content:
    merge: true


media:
  - name: images
    label: Archive Media
    input: public/images/archive
    output: /images/archive
    rename: safe
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
      - mp4
      - webm
      - mov

  - name: noteImages
    label: Note Images
    input: public/images/notes
    output: /images/notes
    rename: safe
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif

  - name: documents
    label: Archive Files
    input: public/files/archive
    output: /files/archive
    rename: safe
    categories:
      - document
      - spreadsheet
      - compressed


content:

  # ==========================================
  # ARCHIVE
  # ==========================================

  - name: archive
    label: Archive
    type: collection
    path: src/content/archive
    format: yaml-frontmatter

    filename:
      template: "{title}.md"
      field: false

    view:
      fields:
        - archiveNumber
        - title
        - dateFound
        - kind
        - featured

      primary: title

      sort:
        - dateFound
        - title

      search:
        - title
        - creator
        - archiveDescription
        - location
        - country
        - region
        - city
        - neighborhood
        - venue
        - kind
        - reason

      default:
        sort: dateFound
        order: desc

    fields:

      # AUTOMATIC — NEVER MANUALLY EDITED

      - name: archiveNumber
        label: Finding No.
        type: string
        hidden: true
        readonly: true


      # BASIC INFORMATION

      - name: title
        label: Title
        type: string
        required: true

      - name: dateFound
        label: Date Found
        type: date
        required: true

      - name: originalDate
        label: Original Date / Era
        type: string
        description: "Optional. Example: 1998, c. 1970, early 2000s."

      - name: creator
        label: Creator
        type: string
        description: "Optional. Artist, architect, designer, brand, author, etc."


      # COVER MEDIA

      - name: coverType
        label: Cover Type
        type: select
        required: true
        default: image
        options:
          values:
            - name: image
              label: Image
            - name: loop
              label: GIF / Loop
            - name: video
              label: Video

      - name: image
        label: Cover Media
        type: file
        required: true
        description: "Upload an image, GIF, looping clip, or video."
        options:
          media: images
          extensions:
            - jpg
            - jpeg
            - png
            - webp
            - gif
            - mp4
            - webm
            - mov

      - name: videoPoster
        label: Video Poster Image
        type: image
        description: "Optional. Add a still preview image for a true Video cover."
        options:
          media: images

      - name: gallery
        label: Additional Views
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "View {index}: {caption}"

        fields:

          - name: image
            label: Image
            type: image
            required: true
            options:
              media: images

          - name: caption
            label: Caption
            type: string
            description: "Optional."

          - name: credit
            label: Credit
            type: string
            description: "Optional."

          - name: sourceUrl
            label: Image Source URL
            type: string


      # DESCRIPTION

      - name: archiveDescription
        label: Description
        type: text


      # PLACE

      - name: location
        label: Location Display
        type: string
        description: "Optional. Write the location naturally as you want it shown on the post."

      - name: country
        label: Country
        type: string

      - name: region
        label: Region / State
        type: string

      - name: city
        label: City
        type: string

      - name: neighborhood
        label: Neighborhood
        type: string

      - name: venue
        label: Venue
        type: string


      # ORGANIZATION

      - name: kind
        label: What Is It?
        type: string
        description: "Describe it however you want."

      - name: reason
        label: Why I Saved It
        type: string
        description: "Optional. Write this however you want."

      - name: collections
        label: Collections
        type: string
        list: true
        description: "Add new collections whenever your archive grows."

      - name: tags
        label: Tags
        type: string
        list: true

      - name: colors
        label: Colors
        type: string
        list: true


      # SOURCE

      - name: sourceName
        label: Source Name
        type: string
        description: "Example: my photograph, museum archive, book title."

      - name: sourceUrl
        label: Original Source URL
        type: string


      # ATTACHMENTS

      - name: attachments
        label: Attachments
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "File {index}: {title}"

        fields:

          - name: file
            label: File
            type: file
            required: true
            options:
              media: documents

          - name: title
            label: File Title
            type: string
            required: true


      # WEBSITE BEHAVIOR

      - name: featured
        label: Feature on Homepage
        type: boolean
        default: false

      - name: favorite
        label: Favorite
        type: boolean
        default: false

      - name: private
        label: Keep Private
        type: boolean
        default: false


      # LONGER WRITING

      - name: body
        label: Longer Notes
        type: rich-text
        options:
          format: markdown
          media: images
          switcher: true



  # ==========================================
  # NOTES
  # FLEXIBLE COMMONPLACE / RESEARCH NOTE SYSTEM
  # ==========================================

  - name: notes
    label: Notes
    type: collection
    path: src/content/notes
    format: yaml-frontmatter

    # No title is needed to create a file.
    # Example:
    # 2026-09-01-22-45-17-quote.md

    filename:
      template: "{year}-{month}-{day}-{hour}-{minute}-{second}-{type}.md"
      field: false


    view:
      fields:
        - type
        - date
        - title
        - author
        - featured

      primary: type

      sort:
        - date
        - type

      search:
        - type
        - title
        - author
        - sourceName
        - location
        - tags

      default:
        sort: date
        order: desc


    fields:

      # ------------------------------------------
      # WHAT KIND OF NOTE IS THIS?
      # ------------------------------------------

      - name: type
        label: Type
        type: select
        required: true
        options:
          placeholder: "Choose a note type"
          values:
            - name: quote
              label: Quote

            - name: note
              label: Note

            - name: thought
              label: Thought

            - name: excerpt
              label: Excerpt

            - name: link
              label: Link

            - name: image
              label: Image

            - name: list
              label: List

            - name: reference
              label: Reference

            - name: question
              label: Question

            - name: idea
              label: Idea

            - name: observation
              label: Observation

            - name: fragment
              label: Fragment

            - name: other
              label: Other


      # ------------------------------------------
      # WHEN YOU SAVED IT
      # ------------------------------------------

      - name: date
        label: Date Saved
        type: date
        required: true


      # ------------------------------------------
      # OPTIONAL LABEL
      # ------------------------------------------

      - name: title
        label: Title
        type: string
        description: "Optional. Leave blank for quotes, fragments, images, quick thoughts, etc."


      # ------------------------------------------
      # AUTHOR / CREATOR
      # ------------------------------------------

      - name: author
        label: Author / Creator
        type: string
        description: "Optional. Person, artist, writer, designer, publication, account, etc."


      # ------------------------------------------
      # SOURCE
      # ------------------------------------------

      - name: sourceName
        label: Source
        type: string
        description: "Optional. Book, article, interview, website, film, publication, etc."

      - name: sourceUrl
        label: Source URL
        type: string
        description: "Optional. Link back to the original source."


      # ------------------------------------------
      # IMAGE
      # ------------------------------------------

      - name: image
        label: Image
        type: image
        description: "Optional. Use for screenshots, visual references, image notes, scans, etc."
        options:
          media: noteImages


      # ------------------------------------------
      # PLACE / CONTEXT
      # ------------------------------------------

      - name: location
        label: Location
        type: string
        description: "Optional. Useful for observations, places, events, or things you encountered in person."


      # ------------------------------------------
      # ORGANIZATION
      # ------------------------------------------

      - name: tags
        label: Tags
        type: string
        list: true
        description: "Optional. Add whatever tags become useful as your notes grow."


      # ------------------------------------------
      # WEBSITE
      # ------------------------------------------

      - name: featured
        label: Featured
        type: boolean
        default: false


      # ------------------------------------------
      # THE NOTE ITSELF
      # ------------------------------------------

      - name: body
        label: Content
        type: rich-text
        description: "Write as much or as little as you want. This can be a quote, thought, list, excerpt, question, caption, link note, or longer piece of writing."
        options:
          format: markdown
          media: noteImages
          switcher: true



  # ==========================================
  # COLLECTIONS
  # ==========================================

  - name: curatedCollections
    label: Collections
    type: collection
    path: src/content/collections
    format: yaml-frontmatter

    filename:
      template: "{title}.md"
      field: false

    view:
      fields:
        - title
        - order
        - featured

      primary: title

      sort:
        - order
        - title

    fields:

      - name: title
        label: Collection Name
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: coverImage
        label: Cover Image
        type: image
        options:
          media: images

      - name: order
        label: Display Order
        type: number

      - name: featured
        label: Featured
        type: boolean
        default: false

      - name: body
        label: Collection Notes
        type: rich-text
        options:
          format: markdown
          media: images
          switcher: true