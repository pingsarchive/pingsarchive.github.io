settings:
  content:
    merge: true

media:
  - name: images
    label: Archive Media
    input: public/images/archive
    output: /images/archive
    rename: safe
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
      - mp4
      - webm
      - mov
      - mp3
      - m4a
      - wav
      - ogg
      - flac
      - pdf
      - txt
      - rtf
      - doc
      - docx
      - csv
      - xls
      - xlsx
      - ppt
      - pptx
      - zip

  - name: noteImages
    label: Note Images
    input: public/images/notes
    output: /images/notes
    rename: safe
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif


content:

  # ==========================================================
  # ARCHIVE
  # ==========================================================

  - name: archive
    label: Archive
    type: collection
    path: src/content/archive
    format: yaml-frontmatter

    filename:
      template: "{title}.md"
      field: false

    view:
      fields:
        - archiveNumber
        - title
        - dateFound
        - primaryObjectType
        - featured

      primary: title

      sort:
        - dateFound
        - title

      search:
        - title
        - archiveDescription
        - reason
        - primaryObjectType

      default:
        sort: dateFound
        order: desc

    fields:

      # ======================================================
      # SYSTEM
      # ======================================================

      - name: archiveNumber
        label: Finding No.
        type: string
        hidden: true
        readonly: true


      # ======================================================
      # IDENTITY
      # ======================================================

      - name: title
        label: Title
        type: string
        required: true
        description: "Use the official title when one exists. Otherwise use a concise descriptive archival title."

      - name: dateFound
        label: Date Found
        type: date
        required: true
        description: "The exact date you personally encountered or saved this finding."


      # ======================================================
      # ORIGINAL DATE / ERA
      # ======================================================

      - name: originalDateDetails
        label: Original Date / Era
        type: object
        description: "Optional. Fill only the parts that are known or useful."

        fields:

          - name: year
            label: Year
            type: number

          - name: month
            label: Month
            type: select
            options:
              placeholder: "Select month"
              values:
                - name: january
                  label: January
                - name: february
                  label: February
                - name: march
                  label: March
                - name: april
                  label: April
                - name: may
                  label: May
                - name: june
                  label: June
                - name: july
                  label: July
                - name: august
                  label: August
                - name: september
                  label: September
                - name: october
                  label: October
                - name: november
                  label: November
                - name: december
                  label: December

          - name: day
            label: Day
            type: number
            options:
              min: 1
              max: 31

          - name: season
            label: Season
            type: select
            options:
              placeholder: "Select season"
              values:
                - name: spring
                  label: Spring
                - name: summer
                  label: Summer
                - name: autumn
                  label: Autumn
                - name: winter
                  label: Winter
                - name: spring/summer
                  label: Spring / Summer
                - name: fall/winter
                  label: Fall / Winter

          - name: timeOfDay
            label: Time of Day
            type: select
            options:
              placeholder: "Select time of day"
              values:
                - name: early morning
                  label: Early Morning
                - name: morning
                  label: Morning
                - name: late morning
                  label: Late Morning
                - name: afternoon
                  label: Afternoon
                - name: late afternoon
                  label: Late Afternoon
                - name: evening
                  label: Evening
                - name: night
                  label: Night
                - name: late night
                  label: Late Night

          - name: qualifier
            label: Qualifier
            type: select
            options:
              placeholder: "Select qualifier"
              values:
                - name: exact
                  label: Exact
                - name: circa
                  label: Circa
                - name: before
                  label: Before
                - name: after
                  label: After
                - name: early
                  label: Early
                - name: mid
                  label: Mid
                - name: late
                  label: Late
                - name: range
                  label: Range
                - name: unknown
                  label: Unknown

          - name: endYear
            label: End Year
            type: number
            description: "Optional. Use for a date range."

          - name: eraLabel
            label: Era Label
            type: string
            description: "Optional custom wording for unusual or imprecise dating."

          - name: dateNote
            label: Date Note
            type: text
            description: "Optional contextual note about the date or time."


      # ======================================================
      # CREATOR(S)
      # ======================================================

      - name: creators
        label: Creator(s)
        type: object

        list:
          collapsible:
            collapsed: true
            summary: "{name} — {role}"

        description: "Add each relevant creator separately."

        fields:

          - name: name
            label: Name
            type: string
            required: true

          - name: role
            label: Role
            type: string
            description: "Optional. Example: Artist, Photographer, Designer, Creative Director, Brand."


      # ======================================================
      # WRITING
      # ======================================================

      - name: archiveDescription
        label: Description
        type: text
        description: "Optional factual or contextual description of the finding."

      - name: reason
        label: Why I Saved It
        type: text
        description: "Optional. Your own reason for saving it or what you want to remember about it."


      # ======================================================
      # CLASSIFICATION
      # ======================================================

      - name: primaryObjectType
        label: Primary Object Type
        type: select
        required: true
        description: "The single main type of object being archived."

        options:
          placeholder: "Choose primary object type"

          values:
            - name: painting
              label: Painting
            - name: drawing
              label: Drawing
            - name: print
              label: Print
            - name: photograph
              label: Photograph
            - name: sculpture
              label: Sculpture
            - name: installation
              label: Installation
            - name: architecture
              label: Architecture
            - name: interior
              label: Interior
            - name: furniture
              label: Furniture
            - name: design object
              label: Design Object
            - name: design system
              label: Design System
            - name: ceramic
              label: Ceramic
            - name: textile
              label: Textile
            - name: garment
              label: Garment
            - name: accessory
              label: Accessory
            - name: fashion campaign
              label: Fashion Campaign
            - name: advertisement
              label: Advertisement
            - name: poster
              label: Poster
            - name: graphic
              label: Graphic
            - name: book
              label: Book
            - name: publication
              label: Publication
            - name: essay
              label: Essay
            - name: article
              label: Article
            - name: letter
              label: Letter
            - name: quote
              label: Quote
            - name: diagram
              label: Diagram
            - name: map
              label: Map
            - name: website
              label: Website
            - name: social media post
              label: Social Media Post
            - name: animation
              label: Animation
            - name: video
              label: Video
            - name: film
              label: Film
            - name: audio
              label: Audio
            - name: music
              label: Music
            - name: performance
              label: Performance
            - name: ephemera
              label: Ephemera
            - name: archive material
              label: Archive Material
            - name: other
              label: Other


      - name: secondaryObjectTypes
        label: Secondary Object Types
        type: string
        list: true
        description: "Optional. Add any other useful object classifications."

      - name: mediums
        label: Medium / Material
        type: string
        list: true
        description: "Optional. Examples: oil on canvas, ceramic tile, printed magazine, digital video."

      - name: themes
        label: Themes / Concepts
        type: string
        list: true
        description: "Optional. Reuse concepts when possible and add new ones as the archive grows."


      # ======================================================
      # COLOR
      # ======================================================

      - name: colors
        label: Colors
        type: select

        options:
          multiple: true
          placeholder: "Select colors"

          values:
            - name: black
              label: Black
            - name: white
              label: White
            - name: gray
              label: Gray
            - name: silver
              label: Silver
            - name: brown
              label: Brown
            - name: beige
              label: Beige
            - name: cream
              label: Cream
            - name: red
              label: Red
            - name: orange
              label: Orange
            - name: yellow
              label: Yellow
            - name: green
              label: Green
            - name: blue
              label: Blue
            - name: purple
              label: Purple
            - name: pink
              label: Pink
            - name: multicolor
              label: Multicolor

      - name: colorNotes
        label: Color Notes
        type: string
        description: "Optional precision such as powder blue, deep cherry red, warm ivory."


      # ======================================================
      # SERIES / PROJECT
      # ======================================================

      - name: seriesProject
        label: Series / Project
        type: string
        description: "Optional. Example: The Swan, DTILE, Fall/Winter 1999 Campaign."

      - name: bodyOfWork
        label: Body of Work
        type: string
        description: "Optional. Use when the finding belongs to a larger body of work."


      # ======================================================
      # LOCATION
      # ======================================================

      - name: locations
        label: Location
        type: string
        list: true
        description: "Optional. Enter locations naturally at whatever level is meaningful."


      # ======================================================
      # COVER MEDIA
      # ======================================================

      - name: coverType
        label: Cover Type
        type: select
        required: true
        default: image

        options:
          values:
            - name: image
              label: Image
            - name: loop
              label: GIF / Loop
            - name: video
              label: Video
            - name: audio
              label: Audio

      - name: image
        label: Cover Media
        type: file
        required: true
        description: "The main media representing this finding."

        options:
          media: images
          extensions:
            - jpg
            - jpeg
            - png
            - webp
            - gif
            - mp4
            - webm
            - mov
            - mp3
            - m4a
            - wav
            - ogg
            - flac

      - name: videoPoster
        label: Poster / Cover Image
        type: image
        description: "Optional. Especially useful for Video or Audio findings."

        options:
          media: images
          extensions:
            - jpg
            - jpeg
            - png
            - webp
            - gif


      # ======================================================
      # ADDITIONAL MEDIA
      # ======================================================

      - name: additionalMedia
        label: Additional Media
        type: object

        list:
          collapsible:
            collapsed: true
            summary: "{mediaType} — {caption}"

        description: "Optional. Add media in the exact order you want it presented."

        fields:

          - name: mediaType
            label: Media Type
            type: select
            required: true

            options:
              placeholder: "Choose media type"

              values:
                - name: image
                  label: Image
                - name: loop
                  label: GIF / Loop
                - name: video
                  label: Video
                - name: audio
                  label: Audio
                - name: document
                  label: Document

          - name: file
            label: File
            type: file
            required: true

            options:
              media: images
              extensions:
                - jpg
                - jpeg
                - png
                - webp
                - gif
                - mp4
                - webm
                - mov
                - mp3
                - m4a
                - wav
                - ogg
                - flac
                - pdf
                - txt
                - rtf
                - doc
                - docx
                - csv
                - xls
                - xlsx
                - ppt
                - pptx
                - zip

          - name: caption
            label: Caption
            type: text

          - name: credit
            label: Credit
            type: string

          - name: sourceUrl
            label: Media Source URL
            type: string


      # ======================================================
      # NOTES
      # ======================================================

      - name: body
        label: Notes
        type: rich-text
        description: "Optional. Personal thoughts, research, quotations, connections, or analysis."

        options:
          format: markdown
          media: images
          switcher: true


      # ======================================================
      # PRIMARY SOURCE
      # ======================================================

      - name: primarySource
        label: Primary Source
        type: object
        description: "The best or most authoritative source for this finding."

        fields:

          - name: type
            label: Source Type
            type: select

            options:
              placeholder: "Choose source type"

              values:
                - name: artist / creator
                  label: Artist / Creator
                - name: museum
                  label: Museum
                - name: gallery
                  label: Gallery
                - name: archive
                  label: Archive
                - name: library
                  label: Library
                - name: brand
                  label: Brand
                - name: publication
                  label: Publication
                - name: journal
                  label: Journal
                - name: book
                  label: Book
                - name: website
                  label: Website
                - name: database
                  label: Database
                - name: other
                  label: Other

          - name: name
            label: Source Name
            type: string

          - name: url
            label: Source URL
            type: string


      # ======================================================
      # DISCOVERED VIA
      # ======================================================

      - name: discovery
        label: Discovered Via
        type: object
        description: "Optional. Preserve the path by which you actually encountered the finding."

        fields:

          - name: type
            label: Discovered Via Type
            type: select

            options:
              placeholder: "Choose discovery type"

              values:
                - name: instagram
                  label: Instagram
                - name: x / twitter
                  label: X / Twitter
                - name: tumblr
                  label: Tumblr
                - name: pinterest
                  label: Pinterest
                - name: tiktok
                  label: TikTok
                - name: reddit
                  label: Reddit
                - name: youtube
                  label: YouTube
                - name: website
                  label: Website
                - name: book
                  label: Book
                - name: magazine
                  label: Magazine
                - name: museum / gallery
                  label: Museum / Gallery
                - name: physical encounter
                  label: Physical Encounter
                - name: personal photograph
                  label: Personal Photograph
                - name: friend / person
                  label: Friend / Person
                - name: other
                  label: Other

          - name: name
            label: Discovered Via
            type: string
            description: "Optional. Account, person, publication, website, place, etc."

          - name: url
            label: Discovery URL
            type: string


      # ======================================================
      # WEBSITE
      # ======================================================

      - name: featured
        label: Feature on Homepage
        type: boolean
        default: false

      - name: private
        label: Keep Private
        type: boolean
        default: false


  # ==========================================================
  # NOTES
  # ==========================================================

  - name: notes
    label: Notes
    type: collection
    path: src/content/notes
    format: yaml-frontmatter

    filename:
      template: "{year}-{month}-{day}-{hour}-{minute}-{second}-{type}.md"
      field: false

    view:
      fields:
        - noteNumber
        - type
        - date
        - title
        - author
        - featured

      primary: type

      sort:
        - date
        - type

      search:
        - type
        - title
        - author
        - sourceName
        - location
        - tags

      default:
        sort: date
        order: desc

    fields:

      # ======================================================
      # SYSTEM
      # ======================================================

      - name: noteNumber
        label: Note No.
        type: string
        hidden: true
        readonly: true


      # ======================================================
      # IDENTITY
      # ======================================================

      - name: type
        label: Type
        type: select
        required: true

        options:
          placeholder: "Choose a note type"

          values:
            - name: essay
              label: Essay
            - name: note
              label: Note
            - name: quote
              label: Quote
            - name: fragment
              label: Fragment
            - name: journal
              label: Journal
            - name: research
              label: Research
            - name: draft
              label: Draft

      - name: date
        label: Date
        type: date
        required: true
        description: "Date this note was written, recorded, or added to the archive."

      - name: title
        label: Title
        type: string
        description: "Optional for quotes and fragments."

      - name: subtitle
        label: Subtitle
        type: string
        description: "Optional secondary title or context."


      # ======================================================
      # WRITING
      # ======================================================

      - name: body
        label: Content
        type: rich-text
        description: "Your essay, note, quote, fragment, journal entry, research, or draft."
        options:
          format: markdown
          media: noteImages
          switcher: true


      # ======================================================
      # CLASSIFICATION
      # ======================================================

      - name: topics
        label: Topics / Concepts
        type: string
        list: true
        description: "Ideas, themes, or subjects connected to this note."

      - name: people
        label: People
        type: string
        list: true
        description: "People mentioned, discussed, or referenced."

      - name: worksReferenced
        label: Works Referenced
        type: string
        list: true
        description: "Books, essays, artworks, films, articles, posts, or other works referenced."

      - name: places
        label: Places
        type: string
        list: true
        description: "Places connected to the writing."


      # ======================================================
      # QUOTE DETAILS
      # ======================================================

      - name: quoteAuthor
        label: Quote Author
        type: string
        description: "Optional. Use for a saved quote."

      - name: quoteSource
        label: Quote Source
        type: string
        description: "Optional. Book, interview, article, speech, scripture, film, etc."

      - name: quoteUrl
        label: Quote Source URL
        type: string
        description: "Optional source link for the quote."


      # ======================================================
      # REFERENCES
      # ======================================================

      - name: references
        label: References
        type: string
        list: true
        description: "Optional sources, citations, links, or reading references."


      # ======================================================
      # WEBSITE
      # ======================================================

      - name: featured
        label: Featured
        type: boolean
        default: false

      - name: private
        label: Keep Private
        type: boolean
        default: false
